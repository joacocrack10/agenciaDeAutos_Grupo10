<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión — Lujo Lujitos</title>
  <link rel="stylesheet" href="loginstyle.css">
</head>
<body>

  <section id="login-section">
    <div class="login-card">
      <p class="eyebrow">ACCESO DE CLIENTES</p>
      <h1>Iniciar Sesión</h1>
      <p class="login-subtitle">Ingresá a tu cuenta para gestionar tus reservas y tu galería personal.</p>

      <form action="#" method="post">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tu@correo.com" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>

        <a href="#" class="login-olvide">¿Olvidaste tu contraseña?</a>

        <button type="submit" class="btn-explorar btn-login">Ingresar</button>
      </form>

      <p class="login-registro">¿No tenés cuenta?</p>
      <a href="#" class="btn-reservar btn-registro">Registrate</a>
    </div>
  </section>

  <footer>
    <p>Lujo Lujitos</p>
  </footer>

</body>
</html>
